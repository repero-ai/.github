name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, deployment mode, browser, architecture, or other relevant context.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, credentials, personal data, and production data before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
