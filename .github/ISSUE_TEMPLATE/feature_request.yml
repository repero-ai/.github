name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds you considered.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility / security / operational impact
      description: Mention any expected migration, security, performance, or deployment impact.
